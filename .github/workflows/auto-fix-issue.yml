name: Auto-Fix Issue with Claude Code

on:
  issues:
    types: [labeled]

concurrency:
  group: auto-fix-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  BASE_BRANCH: v2.1.3-dev

jobs:
  auto-fix:
    if: contains(github.event.issue.labels.*.name, 'auto-reported')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create fix branch
        run: |
          BRANCH_NAME="auto-fix/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Claude Code to fix the issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY=$(cat <<'ISSUE_EOF'
          ${{ github.event.issue.body }}
          ISSUE_EOF
          )

          claude -p "You are fixing a bug reported in GitHub issue #${{ github.event.issue.number }}.

          Issue title: ${ISSUE_TITLE}

          Issue body:
          ${ISSUE_BODY}

          Instructions:
          1. Analyze the error described in the issue
          2. Find the relevant source files in this repository
          3. Fix the bug
          4. Only modify files that are necessary for the fix
          5. Do not add unnecessary comments or documentation
          6. Keep changes minimal and focused

          The repository contains a Volto/Plone AI assistant addon. Key directories:
          - src/components/AIChat/ - Frontend React components
          - src/theme/ - SCSS styles
          - src/helpers/ - Helper utilities

          Fix the issue now." --allowedTools "Edit,Write,Read,Glob,Grep,Bash"  --dangerously-skip-permissions

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "Claude Code Bot"
          git config user.email "claude-bot@interaktiv.de"
          git add -A
          git commit -m "fix: auto-fix for issue #${{ github.event.issue.number }}

          Automated fix generated by Claude Code.
          Closes #${{ github.event.issue.number }}"
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "fix: Auto-fix for #${{ github.event.issue.number }}" \
            --body "## Auto-Fix

          This PR was automatically generated by Claude Code to fix issue #${{ github.event.issue.number }}.

          **Issue:** ${{ github.event.issue.title }}
          **Link:** ${{ github.event.issue.html_url }}

          ---
          *Please review the changes before merging.*

          🤖 Generated by [Claude Code](https://claude.ai/claude-code)" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME"

      - name: Comment on issue if no fix found
        if: steps.changes.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "🤖 **Claude Code** analyzed this issue but could not generate an automated fix. Manual investigation is needed."

      - name: Comment on issue with PR link
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr view "$BRANCH_NAME" --json url -q .url)
          gh issue comment ${{ github.event.issue.number }} \
            --body "🤖 **Claude Code** has created a fix for this issue: ${PR_URL}

          Please review and merge if the fix looks correct."
